<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>弹弹珠机 · Qiongkura</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #151517; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    /* 浏览器调试:收集错误供自动化检查 */
    window.__mgErrors = [];
    window.addEventListener('error', function (e) {
      var msg = '[MG Error] ' + e.message + ' @ ' + e.filename + ':' + e.lineno;
      console.error(msg);
      window.__mgErrors.push(msg);
    });
  </script>
  <!-- 加载顺序即依赖顺序,与 game.js (小游戏入口) 保持一致 -->
  <script src="src/core/util.js"></script>
  <script src="src/platform/platform.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/game/music.js"></script>
  <script src="src/core/physics.js"></script>
  <script src="src/game/config.js"></script>
  <script src="src/game/entities.js"></script>
  <script src="src/game/board.js"></script>
  <script src="src/game/fx.js"></script>
  <script src="src/game/ui.js"></script>
  <script src="src/game/marble-game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
