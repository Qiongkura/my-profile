<!doctype html>
<html lang="zh-CN" data-lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Not found · Qiongkura</title>
    <link rel="stylesheet" href="/styles.css?v=55" />
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add('js');
        try {
          var saved = localStorage.getItem('qiongkura-lang');
          if (saved === 'en' || saved === 'zh') {
            root.setAttribute('data-lang', saved);
            root.setAttribute('lang', saved === 'en' ? 'en' : 'zh-CN');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main id="main-content">
      <section class="panel panel--home" data-section="home">
        <div class="wrap panel-body">
          <div class="home-copy">
            <p class="kicker">404</p>
            <h1 class="wordmark">NOT FOUND</h1>
            <p class="subtitle">
              <span class="zh">这个地址没有对外提供内容</span>
              <span class="en" lang="en">Nothing is served at this path</span>
            </p>
            <p class="lede">
              <span class="zh">返回首页继续浏览。</span>
              <span class="en" lang="en">Head back to the homepage.</span>
            </p>
            <p class="theme-words">
              <a class="ghost-link" href="/">← <span class="zh">回到首页</span><span class="en" lang="en">Back home</span></a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
